[tool.ruff]
line-length = 88
target-version = "py312"
src = ["service_llm_description", "service_llm_local"]
extend-exclude = [
    ".venv",
    "**/__pycache__",
    "service_llm_local/models/*.gguf",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
