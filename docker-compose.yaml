name: test-task-llm

include:
  - path: service_llm_local/docker-compose.yaml

services:
  description:
    build:
      context: ./service_llm_description
      dockerfile: Dockerfile
    container_name: service_llm_description
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./service_llm_description/.env
    environment:
      MODEL_API: http://host.docker.internal:8686/v1
      MODEL_API_KEY: ${MODEL_API_KEY:-local}
      LLM_MODEL: ${LLM_MODEL:-local-llm}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.25}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2500}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_SEARCH_INTERNET: ${LLM_SEARCH_INTERNET:-false}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-5}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-12}
    depends_on:
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 10s
